[package]
name = "hyperblobs-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Blob storage on hypercore-rs, compatible with npm hyperblobs (blob ids, block layout)"
keywords = ["hypercore", "hyperblobs", "p2p", "holepunch"]
categories = ["network-programming"]

[lib]
name = "hyperblobs"

[dependencies]
bytes = "1"
compact-encoding-rs = { path = "../compact-encoding-rs" }
hypercore-rs = { path = "../hypercore-rs" }
tokio = { version = "1.40", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
